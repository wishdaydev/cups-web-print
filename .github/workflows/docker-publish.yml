name: ci-docker-publish

on:
  # 自动触发：推送 main 分支
  # push:
  #   branches: [ "main" ]
  #   # tags: [ 'v*.*.*' ]
    
  # 自动触发：拉取请求到 main 分支
  # pull_request:
  #   branches: [ "main" ]
  
  # 手动触发：允许自定义镜像标签和构建平台
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image Tag--镜像标签'
        required: false
        type: string
        default: 'latest'
      platforms:
        description: 'Target Platform--目标平台 (例如: linux/amd64,linux/arm64,linux/arm/v7)'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64,linux/arm/v7'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6  

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4  

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4 
        with:
          driver: docker-container
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Log in to GHCR
        uses: docker/login-action@v4 
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6  
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=short
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' && format('type=raw,value={0}', github.event.inputs.image_tag) || '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7  
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ github.event.inputs.platforms }}

      - name: Make image public (optional)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/user/packages/container/${{ env.IMAGE_NAME }}/visibility \
            -d '{"visibility":"public"}'
